# Servidor de pruebas del Registro de Visitas.
# Se corre con: ansible-playbook provisionar.yml
# Probado en GitHub Codespaces (Linux, Python 3.12) con ansible-core 2.21.6
- name: Servidor de pruebas - Registro de Visitas
  hosts: localhost
  connection: local
  become: true

  vars:
    registro_clave: "{{ lookup('ansible.builtin.env', 'REGISTRO_CLAVE') }}"
  tasks:
    - name: Los programas sqlite3 y python3-venv están instalados
      ansible.builtin.apt:
        name:
          - sqlite3
          - python3-venv
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: La clave del servidor de pruebas está en el entorno
      ansible.builtin.assert:
        that:
          - registro_clave | length > 0
        fail_msg: >
          Falta REGISTRO_CLAVE. Defínela como secreto de Codespaces
          (Settings > Codespaces > Codespaces secrets) y abre un Codespace nuevo,
          o en esta terminal: read -s REGISTRO_CLAVE && export REGISTRO_CLAVE
        quiet: true

    - name: Existe el usuario de sistema registro
      ansible.builtin.user:
        name: registro
        system: true
        create_home: false

    - name: Existe la carpeta de la aplicación
      ansible.builtin.file:
        path: /opt/registro
        state: directory
        owner: registro
        group: registro
        mode: "0755"

    - name: Está app.py en el servidor
      ansible.builtin.copy:
        src: app.py
        dest: /opt/registro/app.py
        owner: registro
        group: registro

    - name: Está crear_db.py en el servidor
      ansible.builtin.copy:
        src: crear_db.py
        dest: /opt/registro/crear_db.py
        owner: registro
        group: registro

    - name: Está requirements.txt en el servidor
      ansible.builtin.copy:
        src: requirements.txt
        dest: /opt/registro/requirements.txt
        owner: registro
        group: registro

    - name: La configuración del ambiente de pruebas
      ansible.builtin.copy:
        dest: /opt/registro/registro.env
        content: |
          TZ=America/Bogota
          REGISTRO_DB=/opt/registro/registro.db
          REGISTRO_CLAVE={{ registro_clave }}
        owner: registro
        group: registro
        mode: "0600"
      no_log: true

    - name: Existe el ambiente virtual con las dependencias de la aplicación
      ansible.builtin.pip:
        requirements: /opt/registro/requirements.txt
        virtualenv: /opt/registro/.venv
        virtualenv_command: python3 -m venv

    - name: El ambiente virtual pertenece al usuario registro
      ansible.builtin.file:
        path: /opt/registro/.venv
        state: directory
        recurse: true
        owner: registro
        group: registro

    - name: Existe la base de datos vacía de la aplicación
      ansible.builtin.command:
        cmd: /opt/registro/.venv/bin/python /opt/registro/crear_db.py
        creates: /opt/registro/registro.db
      environment:
        REGISTRO_DB: /opt/registro/registro.db

    - name: Se consulta si ya existe la visita de verificación
      ansible.builtin.command: >
        sqlite3 /opt/registro/registro.db
        "SELECT COUNT(*) FROM visitas WHERE nombre = 'Prueba de aprovisionamiento';"
      register: visitas_prueba
      changed_when: false

    - name: Existe la visita de verificación en la base de datos
      ansible.builtin.command: >
        sqlite3 /opt/registro/registro.db
        "INSERT INTO visitas (nombre, momento) VALUES ('Prueba de aprovisionamiento', '2026-10-27 18:30');"
      when: visitas_prueba.stdout | trim == '0'

    - name: La base de datos pertenece al usuario registro
      ansible.builtin.file:
        path: /opt/registro/registro.db
        owner: registro
        group: registro
        mode: "0644"

    - name: El aviso aparece al abrir la terminal
      become: false
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.bashrc"
        line: 'echo "*** SERVIDOR DE PRUEBAS - Registro de Visitas ***"'
